<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ron B*Bot</title>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('SW registrado:', reg.scope);
                    reg.update();
                }).catch(e => console.warn('SW no disponible:', e.message));
            });
        }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <link rel="stylesheet" href="styles.css?v=28.5">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e6f0f8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Librería de Visión IA -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>
    <div id="ron-app" class="ron-container">
        <div id="camera-flash" class="camera-flash"></div>
        <!-- Canvas procedural de la cara -->
        <canvas id="ron-face"></canvas>
        
        <!-- Pantalla de Inicio -->
        <div id="boot-screen" class="boot-screen">
            <button id="power-btn">B-BOT v28.5 - ARRANCAR SISTEMA</button>
        </div>

        <!-- Botones de Control -->
        <button id="mic-toggle-btn" class="mic-toggle-btn">🎙️</button>
        <button id="ble-connect-btn" class="ble-btn">📡</button>

        <!-- Cámara: 160x120px (evita que Android degrade la textura de vídeo) pero invisible -->
        <video id="webcam" autoplay playsinline muted style="position:fixed; top:0; left:0; width:160px; height:120px; opacity:0.01; pointer-events:none; z-index:-1;"></video>
        
        <!-- Configuración de API -->
        <div id="api-modal" class="api-modal hidden">
            <div class="modal-content" style="max-height:90vh;overflow:auto;text-align:left;min-width:280px;max-width:420px">
                <h2>Ajustes de Ron</h2>
                <p style="font-size:13px;color:#555">Solo para mayores. Se abre manteniendo pulsado 📡 tres segundos.</p>
                <label>Clave de Groq (obligatoria)<br><input type="password" id="groq-key-input" placeholder="gsk_..." style="width:100%"></label><br><br>
                <label>Clave de Cerebras (opcional)<br><input type="password" id="cerebras-key-input" placeholder="csk-..." style="width:100%"></label><br><br>
                <label>Clave de OpenRouter (opcional)<br><input type="password" id="openrouter-key-input" placeholder="sk-or-..." style="width:100%"></label><br><br>
                <label>Clave de Gemini / AI Studio (voz y respaldo)<br><input type="password" id="gemini-key-input" placeholder="Pega aquí la clave de AI Studio" style="width:100%"></label><br><br>
                <label>Voz de Ron
                    <select id="voice-engine-input">
                        <option value="gemini">Gemini (natural, con efecto robot)</option>
                        <option value="navegador">Navegador (sin internet ni cuota)</option>
                    </select>
                </label><br><br>
                <label>Voz de Gemini <select id="gemini-voice-input"></select></label>
                <label><input type="checkbox" id="robot-effect-input"> Efecto robot</label>
                <button id="test-voice-btn" type="button">Probar voz</button>
                <div id="test-voice-result" style="font-size:12px;color:#0a6aa8;margin-top:4px"></div><br>
                <label>Hora de dormir <input type="time" id="bedtime-input" value="22:00"></label><br><br>
                <label>Hora de despertar <input type="time" id="waketime-input" value="07:30"></label><br><br>
                <label>Iniciativa de Ron
                    <select id="initiative-input">
                        <option value="alta">Alta (propone algo cada 2-4 min)</option>
                        <option value="media">Media (cada 3-7 min)</option>
                        <option value="baja">Baja (cada 6-12 min)</option>
                    </select>
                </label><br><br>
                <label>Oído de Ron
                    <select id="stt-input">
                        <option value="whisper">Whisper (Groq) — entiende mejor a niños</option>
                        <option value="navegador">Navegador — sin gastar cuota</option>
                    </select>
                </label><br><br>
                <label>Cuándo te escucha
                    <select id="listen-mode-input">
                        <option value="cara">Siempre que te vea delante (recomendado)</option>
                        <option value="ron">Solo si le dices «Ron»</option>
                    </select>
                </label><br><br>
                <label><input type="checkbox" id="captions-input"> Subtítulos (lo que oye y lo que dice)</label><br>
                <label><input type="checkbox" id="diag-input"> Diagnóstico en pantalla (registro técnico)</label><br><br>

                <!-- Copia de seguridad y gestión de caras -->
                <div style="border-top:1px solid #ddd;padding-top:10px;margin-bottom:10px">
                    <strong style="font-size:13px">Memoria Permanente (Caras y Recuerdos)</strong>
                    <div id="known-faces-list" style="font-size:12px;color:#333;margin:6px 0"></div>
                    <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
                        <button id="export-memory-btn" type="button" style="background:#0a6aa8;font-size:12px;padding:7px;flex:1">💾 Exportar</button>
                        <button id="import-memory-btn" type="button" style="background:#4b5563;font-size:12px;padding:7px;flex:1">📂 Restaurar</button>
                        <button id="reset-faces-btn" type="button" style="background:#dc2626;font-size:12px;padding:7px;flex:1">🔄 Re-escanear caras</button>
                        <input type="file" id="import-memory-file" accept=".json" style="display:none">
                    </div>
                    <div id="backup-status" style="font-size:12px;color:#0a6aa8;margin-top:4px"></div>
                </div>

                <div id="usage-info" style="font-size:12px;color:#555;white-space:pre-line"></div><br>
                <button id="save-api-key">Guardar</button>
                <button id="close-settings-btn" type="button" style="margin-top:6px;background:#6b7280">Cerrar</button>
            </div>
        </div>

        <!-- Capa de Efectos de Fondo (Glitch) -->
        <div id="glitch-overlay" class="glitch-overlay"></div>

        <!-- Reproductor Invisible (Estilo Chronobeats) -->
        <div id="music-container" style="position: absolute; left: -999px; top: -999px; width: 200px; height: 200px; overflow: hidden; opacity: 0.01; pointer-events: none;">
            <div id="ron-yt-player"></div>
        </div>

        <!-- Cara de Ron -->
        <div class="face-container">
            <div class="eyes-layer">
                <div id="eye-left" class="eye"></div>
                <div id="eye-right" class="eye"></div>
            </div>
            <div class="mouth-layer">
                <svg class="mouth-svg" viewBox="0 0 100 60">
                    <path id="mouth-path" d="M 25 35 Q 50 50 75 35" />
                </svg>
            </div>
            <!-- Iconos del Pecho -->
            <div id="chest-icon-container" class="chest-icon-container"></div>
        </div>

        <!-- UI de Juegos -->
        <div id="game-panel" class="game-panel hidden">
            <div class="game-panel-header">
                <button id="close-game-btn" class="close-game-btn">✕</button>
            </div>
            <div class="game-panel-body">
                <div id="game-text"></div>
            </div>
        </div>
        
        <!-- UI de Control -->
        <div id="debug-info"></div>
        <!-- Subtítulos -->
        <div id="caption" class="caption"></div>
        
        <!-- Panel de Selfie (Polaroid) -->
        <div id="photo-panel" class="hidden">
            <div class="polaroid">
                <img id="photo-img" src="" alt="Selfie">
            </div>
        </div>

        <!-- Panel de Cuento -->
        <div id="story-panel" class="game-panel hidden">
            <button id="close-story-btn" class="close-game-btn" onclick="document.getElementById('story-panel').classList.add('hidden');">❌</button>
            <div id="story-text"></div>
        </div>

        <!-- Burbuja de estado de ánimo -->
        <div id="mood-bubble" class="mood-bubble hidden"></div>

        <!-- Wrapper de cara -->
        <div id="face-wrapper"></div>
    </div>
    <script>
        const CACHE_NAME = 'ron-bot-v28.5';
        window.addEventListener('DOMContentLoaded', () => {
            const expBtn = document.getElementById('export-memory-btn');
            const impBtn = document.getElementById('import-memory-btn');
            const resetFacesBtn = document.getElementById('reset-faces-btn');
            const impFile = document.getElementById('import-memory-file');
            const status = document.getElementById('backup-status');
            const facesList = document.getElementById('known-faces-list');
            const KEYS = ['ron_known_faces', 'ron_memory_v1', 'ron_user_stats', 'ron_diary', 'ron_bond', 'ron_friendship_rules', 'ron_learnt_facts'];

            function updateFacesCount() {
                try {
                    const faces = JSON.parse(localStorage.getItem('ron_known_faces') || '[]');
                    facesList.textContent = faces.length
                        ? 'Caras guardadas: ' + faces.map(f => `${f.label} (${(f.descriptors || []).length})`).join(', ')
                        : 'Ninguna cara guardada todavía.';
                } catch (e) {}
            }
            setInterval(updateFacesCount, 2000);
            updateFacesCount();

            if (resetFacesBtn) resetFacesBtn.onclick = async () => {
                if (!confirm('¿Borrar solo las muestras de caras para volver a escanearlas con mejor luz? (Los recuerdos, diario y amistad NO se borran)')) return;
                localStorage.removeItem('ron_known_faces');
                try {
                    const idMod = await import('./identity.js');
                    if (idMod.vaultSet) await idMod.vaultSet('ron_known_faces', []);
                    const { RonState } = await import('./core.js');
                    RonState.knownFaces = [];
                    RonState.currentUser = null;
                } catch (e) {}
                updateFacesCount();
                status.textContent = '✅ Caras limpiadas. Ponte frente a Ron con buena luz para escanear de nuevo.';
            };

            if (expBtn) expBtn.onclick = () => {
                const dump = { ts: new Date().toISOString(), data: {} };
                KEYS.forEach(k => {
                    try { dump.data[k] = JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) {}
                });
                const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `memoria_ron_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                status.textContent = '✅ Copia de seguridad descargada.';
            };

            if (impBtn && impFile) {
                impBtn.onclick = () => impFile.click();
                impFile.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    try {
                        const text = await file.text();
                        const parsed = JSON.parse(text);
                        if (!parsed || !parsed.data) throw new Error('Formato inválido');
                        const idMod = await import('./identity.js');
                        for (const k of KEYS) {
                            if (parsed.data[k] !== undefined && parsed.data[k] !== null) {
                                localStorage.setItem(k, JSON.stringify(parsed.data[k]));
                                if (idMod.vaultSet) await idMod.vaultSet(k, parsed.data[k]);
                            }
                        }
                        status.textContent = '✅ Memoria restaurada. Recargando…';
                        setTimeout(() => location.reload(), 1200);
                    } catch (err) {
                        status.textContent = '❌ Error al restaurar: ' + err.message;
                    }
                };
            }
        });
    </script>
    <script type="module" src="app.js?v=28.5"></script>
</body>
</html>
