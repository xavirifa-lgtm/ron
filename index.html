<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ron B*Bot</title>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('SW registrado:', reg.scope);
                    reg.update();
                }).catch(e => console.warn('SW no disponible:', e.message));
            });
        }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <link rel="stylesheet" href="styles.css?v=28.3">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e6f0f8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Librería de Visión IA -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>
    <div id="ron-app" class="ron-container">
        <div id="camera-flash" class="camera-flash"></div>
        <!-- Canvas procedural de la cara -->
        <canvas id="ron-face"></canvas>
        
        <!-- Pantalla de Inicio -->
        <div id="boot-screen" class="boot-screen">
            <button id="power-btn">B-BOT v28.3 [OFFLINE] - ARRANCAR SISTEMA MANUAL</button>
        </div>

        <!-- Botones de Control -->
        <button id="mic-toggle-btn" class="mic-toggle-btn">🎙️</button>
        <button id="ble-connect-btn" class="ble-btn">📡</button>

        <!-- Cámara: invisible pero viva -->
        <video id="webcam" autoplay playsinline muted style="position:fixed; top:0; left:0; width:4px; height:4px; opacity:0.01; pointer-events:none; z-index:-1;"></video>
        
        <!-- Configuración de API -->
        <div id="api-modal" class="api-modal hidden">
            <div class="modal-content" style="max-height:90vh;overflow:auto;text-align:left;min-width:280px;max-width:420px">
                <h2>Ajustes de Ron</h2>
                <p style="font-size:13px;color:#555">Solo para mayores. Se abre manteniendo pulsado 📡 tres segundos.</p>
                <label>Clave de Groq (obligatoria)<br><input type="password" id="groq-key-input" placeholder="gsk_..." style="width:100%"></label><br><br>
                <label>Clave de Cerebras (opcional)<br><input type="password" id="cerebras-key-input" placeholder="csk-..." style="width:100%"></label><br><br>
                <label>Clave de OpenRouter (opcional)<br><input type="password" id="openrouter-key-input" placeholder="sk-or-..." style="width:100%"></label><br><br>
                <label>Clave de Gemini / AI Studio (voz y respaldo)<br><input type="password" id="gemini-key-input" placeholder="Pega aquí la clave de AI Studio" style="width:100%"></label><br><br>
                <label>Voz de Ron
                    <select id="voice-engine-input">
                        <option value="gemini">Gemini (natural, con efecto robot)</option>
                        <option value="navegador">Navegador (sin internet ni cuota)</option>
                    </select>
                </label><br><br>
                <label>Voz de Gemini <select id="gemini-voice-input"></select></label>
                <label><input type="checkbox" id="robot-effect-input"> Efecto robot</label>
                <button id="test-voice-btn" type="button">Probar voz</button>
                <div id="test-voice-result" style="font-size:12px;color:#0a6aa8;margin-top:4px"></div><br>
                <label>Hora de dormir <input type="time" id="bedtime-input" value="22:00"></label><br><br>
                <label>Hora de despertar <input type="time" id="waketime-input" value="07:30"></label><br><br>
                <label>Iniciativa de Ron
                    <select id="initiative-input">
                        <option value="alta">Alta (propone algo cada 2-4 min)</option>
                        <option value="media">Media (cada 3-7 min)</option>
                        <option value="baja">Baja (cada 6-12 min)</option>
                    </select>
                </label><br><br>
                <label>Oído de Ron
                    <select id="stt-input">
                        <option value="whisper">Whisper (Groq) — entiende mejor a niños</option>
                        <option value="navegador">Navegador — sin gastar cuota</option>
                    </select>
                </label><br><br>
                <label>Cuándo te escucha
                    <select id="listen-mode-input">
                        <option value="cara">Siempre que te vea delante (recomendado)</option>
                        <option value="ron">Solo si le dices «Ron»</option>
                    </select>
                </label><br><br>
                <label><input type="checkbox" id="captions-input"> Subtítulos (lo que oye y lo que dice)</label><br>
                <label><input type="checkbox" id="diag-input"> Diagnóstico en pantalla (registro técnico)</label><br><br>
                <div id="usage-info" style="font-size:12px;color:#555;white-space:pre-line"></div><br>
                <button id="save-api-key">Guardar</button>
                <button id="close-settings-btn" type="button">Cerrar</button>
            </div>
        </div>

        <!-- Capa de Efectos de Fondo (Glitch) -->
        <div id="glitch-overlay" class="glitch-overlay"></div>

        <!-- Reproductor Invisible (Estilo Chronobeats) -->
        <div id="music-container" style="position: absolute; left: -999px; top: -999px; width: 200px; height: 200px; overflow: hidden; opacity: 0.01; pointer-events: none;">
            <div id="ron-yt-player"></div>
        </div>

        <!-- Cara de Ron -->
        <div class="face-container">
            <div class="eyes-layer">
                <div id="eye-left" class="eye"></div>
                <div id="eye-right" class="eye"></div>
            </div>
            <div class="mouth-layer">
                <svg class="mouth-svg" viewBox="0 0 100 60">
                    <path id="mouth-path" d="M 25 35 Q 50 50 75 35" />
                </svg>
            </div>
            <!-- Iconos del Pecho -->
            <div id="chest-icon-container" class="chest-icon-container"></div>
        </div>

        <!-- UI de Juegos -->
        <div id="game-panel" class="game-panel hidden">
            <div class="game-panel-header">
                <button id="close-game-btn" class="close-game-btn">✕</button>
            </div>
            <div class="game-panel-body">
                <div id="game-text"></div>
            </div>
        </div>
        
        <!-- UI de Control -->
        <div id="debug-info"></div>
        <!-- Subtítulos -->
        <div id="caption" class="caption"></div>
        
        <!-- Panel de Selfie (Polaroid) -->
        <div id="photo-panel" class="hidden">
            <div class="polaroid">
                <img id="photo-img" src="" alt="Selfie">
            </div>
        </div>

        <!-- Panel de Cuento -->
        <div id="story-panel" class="game-panel hidden">
            <button id="close-story-btn" class="close-game-btn" onclick="document.getElementById('story-panel').classList.add('hidden');">❌</button>
            <div id="story-text"></div>
        </div>

        <!-- Burbuja de estado de ánimo -->
        <div id="mood-bubble" class="mood-bubble hidden"></div>

        <!-- Wrapper de cara -->
        <div id="face-wrapper"></div>
    </div>
    <script>const CACHE_NAME = 'ron-bot-v28.3';</script>
    <script type="module" src="app.js?v=28.3"></script>
</body>
</html>
